name: build-server
on:
  push:
    branches: [server-vulkan]
    paths: [".github/workflows/build-server.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Instalar NDK
        run: |
          sdkmanager --install "ndk;29.0.13113456" > /dev/null
          ls $ANDROID_HOME/ndk
      - name: Vulkan SDK (glslc)
        run: |
          V=$(curl -s https://vulkan.lunarg.com/sdk/latest/linux.txt)
          echo "version=$V"
          mkdir vulkan_sdk
          curl -sL "https://sdk.lunarg.com/sdk/download/$V/linux/vulkan_sdk.tar.xz" | tar -xJ -C vulkan_sdk --strip-components=1
          vulkan_sdk/x86_64/bin/glslc --version
      - name: Cabeceras Vulkan y SPIR-V
        run: |
          git clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers $HOME/Vulkan-Headers
          git clone -q https://github.com/KhronosGroup/SPIRV-Headers $HOME/SPIRV-Headers
          git -C $HOME/SPIRV-Headers checkout -q 04fd3caa1e8267e4d95c806cad901181728e1006
          cmake -S $HOME/SPIRV-Headers -B $HOME/spirv-build -DCMAKE_INSTALL_PREFIX=$HOME/spirv-install
          cmake --install $HOME/spirv-build
          echo "CPLUS_INCLUDE_PATH=$HOME/spirv-install/include" >> "$GITHUB_ENV"
      - name: Ediciones
        run: bash ci/patch.sh
      - name: Compilar
        run: |
          cd examples/llama.android
          ./gradlew :app:assembleDebug --no-daemon > ../../gradle.log 2>&1 || { tail -150 ../../gradle.log; exit 1; }
      - name: Verificar
        run: |
          APK=$(ls examples/llama.android/app/build/outputs/apk/debug/*.apk)
          ls -l $APK
          unzip -l $APK | grep "lib/"
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: server-apk
          path: examples/llama.android/app/build/outputs/apk/debug/*.apk
